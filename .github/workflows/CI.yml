name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR associated with an automated CI dispatch
        type: string
        default: ''
      expected_sha:
        description: Exact branch head expected by the dispatcher
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || format('{0}-{1}', github.event_name, github.ref) }}
  # Never cancel a production upload when a newer master push arrives.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject superseded automated dispatches
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Validate autonomous agent policy and orchestration
        run: node --test .github/scripts/codex/*.test.mjs
      - name: Validate deployment safety
        run: python3 -m unittest discover -s .github/scripts/deploy -p 'test_*.py'
      - name: Install Chromium for unit and browser tests
        run: npx playwright install --with-deps --no-shell chromium
      - name: Share Chromium with Karma
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_BIN=" + require("@playwright/test").chromium.executablePath() + "\n")'
      - name: Build production application
        run: npm run build -- --configuration=production
      - name: Run unit tests in headless Chrome
        run: npm run test:ci
      - name: Check production rendering and interactions
        run: npm run e2e
      - name: Retain validated production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-${{ github.sha }}
          path: app/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hostinger-release.yml
    with:
      run_id: ${{ github.run_id }}
      automatic: true
    secrets: inherit
