name: App release
run-name: "App release · ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - '!src/**/*.spec.ts'
      - '!src/test.ts'
      - '!src/karma.conf.js'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'angular.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'ngsw-config.json'
      - '.browserslistrc'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Install Chromium for unit and browser tests
        run: npx playwright install --with-deps --no-shell chromium
      - name: Share Chromium with Karma
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_BIN=" + require("@playwright/test").chromium.executablePath() + "\n")'
      - name: Build production application
        run: npm run build -- --configuration=production
      - name: Run unit tests
        run: npm run test:ci
      - name: Check production rendering and interactions
        run: npm run e2e
      - name: Retain validated production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-${{ github.sha }}
          overwrite: true
          path: app/
          if-no-files-found: error
          retention-days: 30
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/hostinger-release.yml
    with:
      run_id: ${{ github.run_id }}
      automatic: true
    secrets: inherit
