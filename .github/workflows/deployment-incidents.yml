name: Deployment incidents

on:
  workflow_run:
    workflows: [CI, Deploy Hostinger manually]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: deployment-incident-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      contains(fromJSON('["failure", "timed_out", "cancelled", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report unconfirmed production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deploy/incident.py
