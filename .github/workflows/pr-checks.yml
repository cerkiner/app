name: PR checks
run-name: "PR checks · #${{ github.event.pull_request.number || inputs.pr_number }} · ${{ github.event.pull_request.title || inputs.expected_head_sha }}"

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to validate again; does not approve pending workflows
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify_issue_link:
    name: Verify native issue link permissions
    if: github.event.pull_request.number == 70 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify linking an open test issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { gh } from './.github/scripts/tasks/lib.mjs';
          import { syncClosingIssue } from './.github/scripts/tasks/tasks.mjs';
          const repo = process.env.GH_REPO;
          const pr = gh(`repos/${repo}/pulls/70`);
          const issue = gh(`repos/${repo}/issues`, { method: 'POST', body: {
            title: 'Verify automatic issue closing links',
            body: 'Temporary verification for PR #70. The validation job closes this issue after testing the native link.',
          } });
          try {
            assert.equal(issue.state, 'open');
            assert.equal(await syncClosingIssue(pr, issue, pr.head.sha, false), false);
            assert.equal(await syncClosingIssue(pr, issue, pr.head.sha, true), false);
            assert.equal(gh(`repos/${repo}/issues/${issue.number}`).state, 'open');
            console.log(`GitHub exposed a closing link for open issue ${issue.number} without closing it before merge.`);
          } finally {
            try { await syncClosingIssue(pr, issue, pr.head.sha, false); }
            finally { gh(`repos/${repo}/issues/${issue.number}`, { method: 'PATCH', body: { state: 'closed', state_reason: 'completed' } }); }
          }
          console.log(`Removed the closing link and closed temporary issue ${issue.number}.`);
          JS
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.expected_head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select documentation-only validation
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
        run: node .github/scripts/tasks/validation.mjs
      - name: Check documentation patch whitespace
        if: steps.scope.outputs.documentation_only == 'true'
        run: git diff --check HEAD^ HEAD
      - name: Install dependencies from lockfile
        if: steps.scope.outputs.documentation_only != 'true'
        run: npm ci
      - name: Install Chromium for unit and browser tests
        if: steps.scope.outputs.documentation_only != 'true'
        run: npx playwright install --with-deps --no-shell chromium
      - name: Share Chromium with Karma
        if: steps.scope.outputs.documentation_only != 'true'
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_BIN=" + require("@playwright/test").chromium.executablePath() + "\n")'
      - name: Build production application
        if: steps.scope.outputs.documentation_only != 'true'
        run: npm run build -- --configuration=production
      - name: Run unit tests
        if: steps.scope.outputs.documentation_only != 'true'
        run: npm run test:ci
      - name: Check production rendering and interactions
        if: steps.scope.outputs.documentation_only != 'true'
        run: npm run e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  follow_up:
    name: Start review or repair
    needs: validate
    if: always() && contains(fromJSON('["success", "failure"]'), needs.validate.result) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the existing trusted follow-up workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK: ${{ needs.validate.result == 'success' && 'review' || 'ci-repair' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
        run: |
          gh workflow run pr-follow-up.yml --repo "$GH_REPO" --ref "$DEFAULT_BRANCH" \
            -f task="$TASK" -f pr_number="$PR_NUMBER" \
            -f expected_head_sha="$EXPECTED_SHA" -f checks_run_id="$GITHUB_RUN_ID"
