version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
        update-types: [minor, patch]
      ionic:
        patterns:
          - '@ionic/*'
        update-types: [minor, patch]
      cordova:
        patterns:
          - '*cordova*'
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
